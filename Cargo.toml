[workspace]
resolver = "3"
members = ["crates/mere-base", "crates/mere-png", "crates/mere-win32", "crates/mere-layout", "crates/mere-ui", "demos/relief", "demos/shell-boxes", "demos/widgets", "demos/preview"]

[workspace.package]
version = "0.12.0"
edition = "2024"
publish = false

[workspace.dependencies]
mere-base = { path = "crates/mere-base" }
mere-png = { path = "crates/mere-png" }
mere-win32 = { path = "crates/mere-win32" }
mere-layout = { path = "crates/mere-layout" }
mere-ui = { path = "crates/mere-ui" }

[profile.release]
opt-level = 3
lto = true
strip = true


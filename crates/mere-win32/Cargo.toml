[package]
name = "mere-win32"
description = "The Windows backend: a Win32 window, Direct3D 11 for meshes, Direct2D and DirectWrite for the interface, offscreen pictures."
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-only"

[dependencies]
mere-base.workspace = true

# Pinned exactly: the feature names below changed between versions of the crate.
[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
mere-png.workspace = true
# Only for the shape tests, which count a pixel icon's area with its own mask.
mere-ui.workspace = true
